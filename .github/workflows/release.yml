name: Build and Release LucidChaos

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone distribution with PyInstaller
        run: |
          pyinstaller LucidChaos.spec

      - name: Package portable zip
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $distDir = "dist/LucidChaos"
          Copy-Item "README.md" -Destination $distDir
          Copy-Item "start_gui.bat" -Destination $distDir
          $zipName = "LucidChaos-$ver-windows-x64.zip"
          Compress-Archive -Path "$distDir/*" -DestinationPath $zipName
          Write-Host "Created release archive: $zipName"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LucidChaos ${{ github.ref_name }}"
          files: LucidChaos-*-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
